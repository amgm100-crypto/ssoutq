function ivSum(){let t=0;document.querySelectorAll('.iv-tbl').forEach(tb=>{let s=0;tb.querySelectorAll('[data-ivs]').forEach(i=>{let v=+i.value||0;const m=+i.dataset.max;if(v>m){v=m;i.value=m}s+=v});tb.querySelector('.ivsec').textContent=s;t+=s});$('#ivtot').textContent=t}
function ivRead(s){const T=IVT[s.tpl];const head={};document.querySelectorAll('[data-ivh]').forEach(e=>head[e.dataset.ivh]=e.value.trim());
  const scores=[...document.querySelectorAll('[data-ivs]')].map(i=>i.value===''?null:+i.value);const fit=document.querySelector('input[name="iv_fit"]:checked')?.value||'';
  const members=[...document.querySelectorAll('.iv-mem')].map(m=>({name:m.querySelector('[data-m=name]').value.trim(),title:m.querySelector('[data-m=title]').value.trim(),sig:sigVal('iv_sig_'+m.dataset.i)||document.getElementById('iv_sig_'+m.dataset.i).dataset.val||''})).filter(m=>m.name);
  return{head,scores,fit,total:scores.reduce((a,b)=>a+(b||0),0),notes:$('#iv_notes').value.trim(),date:$('#iv_date').value,members}}

/* ----- signature pad ----- */
function sigPad(id,val){return `<div class="sigpad"><canvas id="${id}" width="520" height="150" data-val="${esc(val||'')}"></canvas><div class="row" style="margin-top:4px"><button type="button" class="btn sm" onclick="sigClear('${id}')">مسح</button>${me()&&me().sig?`<button type="button" class="btn sm" onclick="sigLoad('${id}',me().sig)">استخدام توقيعي المحفوظ</button>`:''}<span class="small muted">وقّع بإصبعك أو بالفأرة داخل المربع</span></div></div>`}
function sigInit(id){const c=document.getElementById(id);if(!c)return;const x=c.getContext('2d');x.lineWidth=2.4;x.lineCap='round';x.strokeStyle='#14141F';c.dataset.dirty='';
  if(c.dataset.val)sigLoad(id,safeImg(c.dataset.val));
  let dn=false;const pos=e=>{const r=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height]};
  const st=e=>{dn=true;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b);e.preventDefault()};const mv=e=>{if(!dn)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke();c.dataset.dirty='1';e.preventDefault()};const en=()=>dn=false;
  c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en)}
function sigClear(id){const c=document.getElementById(id);c.getContext('2d').clearRect(0,0,c.width,c.height);c.dataset.dirty='';c.dataset.val=''}
function sigLoad(id,src){const c=document.getElementById(id);if(!c||!src)return;const im=new Image();im.onload=()=>{const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.dataset.dirty='1'};im.src=src}
function sigVal(id){const c=document.getElementById(id);return c&&c.dataset.dirty?c.toDataURL('image/png'):''}

function rfInput(fd,v,pfx){const id=pfx+fd.k;v=v??'';
  if(fd.h)return `<h4 class="rq-h">${esc(fd.h)}</h4>`;
  if(fd.t==='note')return `<div class="banner pri" style="margin:4px 0 10px"><div class="txt small">${esc(fd.l)}</div></div>`;
  const lab=`<label for="${id}">${esc(fd.l)}${fd.req?'<span style="color:var(--bad)"> *</span>':''}</label>`;
  if(fd.t==='textarea')return `<div class="field rq-wide">${lab}<textarea id="${id}">${esc(v)}</textarea></div>`;
  if(fd.t==='date')return `<div class="field">${lab}<input id="${id}" type="date" value="${esc(v)}" oninput="this.nextElementSibling.textContent=hijri(this.value)"><span class="hint">${v?hijri(v):''}</span></div>`;
  if(fd.t==='num')return `<div class="field">${lab}<input id="${id}" type="number" min="0" value="${esc(v)}"></div>`;
  if(fd.t==='select')return `<div class="field">${lab}<select id="${id}"><option value="">—</option>${fd.o.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;

async function reqSubmit(k,rid){const f=rform(k);const d={};f.fields.forEach(fd=>{if(fd.k&&fd.t!=='note')d[fd.k]=rfRead(fd,'rq_')});

  else{r=Object.assign({id:uid(),no:nextReqNo(),type:k,complexId:cx,createdBy:me().id,createdAt:new Date().toISOString(),steps:reqBuildSteps(f,d),log:[{at:new Date().toISOString(),by:base.byName,t:'رفع الطلب ووقّعه'}]},base);}

    if(rid){if(!await reqSave(r))return}

function reqAdvance(r){const s=r.steps.find(x=>x.status!=='done'&&x.status!=='skipped');r.steps.forEach(x=>{if(x.status==='pending')x.status='wait'});

  if(s.fromRoute){const rt=r.steps.find(x=>x.kind==='route');s.roles=(rt&&rt.result&&rt.result.roles)||[];if(!s.roles.length||(rt&&rt.result&&rt.result.tpl)){s.status='skipped';return reqAdvance(r)}}
  s.status='pending'}

async function downloadEvZip(){

        let base=clean(r.e.caption||String(r.e.name).replace(/\.[^.]+$/,''));let fn=folder+'/'+base+'.'+ext;let k=2;while(used[fn]){fn=folder+'/'+base+' ('+(k++)+').'+ext}used[fn]=1;
        zip.file(fn,blob);ok++}catch(e){fail++}}
    setImp('جارٍ ضغط الملف…',95);
    const out=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a');a.href=URL.createObjectURL(out);a.download='شواهد-المجمعات-'+todayISO()+'.zip';document.body.appendChild(a);a.click();a.remove();
    setImp(`اكتمل التنزيل: ${ok} شاهداً${fail?`، وتعذّر ${fail}`:''}.`,100);
  }catch(e){setImp(errMsg(e))}
}

    if(error){let m=error.message||'';try{const j=await error.context.json();m=j.error||m}catch(e){}throw new Error(/not found|404/i.test(m)?'خدمة الذكاء الاصطناعي لم تُفعَّل بعد':'تعذّر الاتصال بخدمة الذكاء الاصطناعي: '+m)}

    const t=String(data?.text||'').replace(/```json|```/g,'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');
    return JSON.parse(a>=0?t.slice(a,b+1):t)}}}

/* ---------- PDF plan import (AI) ---------- */
let PDFJS=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
async function getPdfJs(){
  if(PDFJS)return PDFJS;
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base+'pdf.min.js');await loadScript(base+'pdf.worker.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  return PDFJS=window.pdfjsLib;
}
function importPlan(cid,tid){
  modal('استيراد الخطة من ملف PDF',`<p style="margin-top:0">ارفع ملف خطة المجمع كما هو، وسيقرؤه الذكاء الاصطناعي ويحوّل كل برنامج فيه إلى بطاقة. تراجع البطاقات وتكمل الناقص، ثم تضيفها إلى خطتك.</p>
   <label class="drop" for="ipf">اختر ملف الخطة (PDF)<br><span class="small">حتى 20 صفحة، ويُفضّل أن يكون واضح القراءة</span></label><input id="ipf" type="file" accept="application/pdf,.pdf" class="hidden">
   <div id="ipst" class="small muted" style="margin-top:10px"></div>`,[]);
  $('#ipf').onchange=e=>{const f=e.target.files[0];if(f)runImport(f,cid,tid)};
}
function setImp(msg,pct){const el=$('#ipst');if(el)el.innerHTML=`${esc(msg)}${pct!=null?`<div class="progress"><i style="width:${pct}%"></i></div>`:''}`}
async function runImport(file,cid,tid){
  const term=S.terms.find(t=>t.id===tid);
  const lbl=document.querySelector('label[for=ipf]');if(lbl)lbl.style.display='none';
  try{
    setImp('جارٍ فتح الملف…',5);
    const sample=aiClient();
    if(!sample){setImp('خدمة الذكاء الاصطناعي غير متاحة في هذه الشاشة. افتح المنصة من حسابك في Claude.');return}
    const lim=await sample.limits().catch(()=>null);const maxImg=lim?.images?.maxCount||0;
    const pdfjs=await getPdfJs();
    const doc=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const n=Math.min(doc.numPages,20);let text='';const imgs=[];
    for(let i=1;i<=n;i++){
      setImp(`جارٍ قراءة الصفحة ${i} من ${n}…`,5+Math.round(i/n*35));
      const pg=await doc.getPage(i);
      const tc=await pg.getTextContent();text+=`\n--- صفحة ${i} ---\n`+tc.items.map(x=>x.str).join(' ');
      if(maxImg){const vp0=pg.getViewport({scale:1});const sc=Math.min(2,1500/vp0.width);const vp=pg.getViewport({scale:sc});
        const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        imgs.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.82)))}
    }
    const batches=[];const per=maxImg||n;for(let i=0;i<Math.max(1,n);i+=per)batches.push({from:i,imgs:imgs.slice(i,i+per)});
    let found=[];
    for(let b=0;b<batches.length;b++){
      setImp(batches.length>1?`الذكاء الاصطناعي يحلل الخطة (جزء ${b+1} من ${batches.length})…`:'الذكاء الاصطناعي يحلل الخطة… قد يستغرق دقيقة',45+Math.round((b+1)/batches.length*50));
      const res=await sample.json(importPrompt(term,text,batches[b],n),{images:batches[b].imgs.length?batches[b].imgs:undefined,modelTier:'default'});
      found=found.concat(Array.isArray(res?.programs)?res.programs:Array.isArray(res)?res:[]);
    }
    if(!found.length){setImp('لم يُعثر على برامج في الملف. تأكد أنه ملف الخطة، أو أضف البرامج يدوياً.');return}
    reviewImport(found.map(x=>normImport(x,term)),cid,tid);
  }catch(err){
    const c=err?.code;
    setImp(/[\u0600-\u06FF]/.test(err?.message||'')?err.message:'تعذّرت قراءة الملف. تأكد أنه PDF سليم ثم أعد المحاولة.');
    console.error(err);
  }
}
function importPrompt(term,text,batch,n){
  return `أنت مساعد يقرأ "خطة فصلية" لمجمع من مجمعات تحفيظ القرآن الكريم في عنيزة، ويستخرج منها كل برنامج أو فعالية مجدولة.
الفصل الدراسي: ${term.name}، من ${hijri(term.start)} (${term.start}) إلى ${hijri(term.end)} (${term.end}).
${batch.imgs.length?`الصور المرفقة هي صفحات الخطة من ${batch.from+1} إلى ${batch.from+batch.imgs.length} من أصل ${n}، بالترتيب. اعتمد على الصور أولاً.`:''}
نص مستخرج آلياً من الملف (قد يكون ترتيب كلماته العربية مقلوباً، فاستعمله للمساعدة فقط):
"""${text.slice(0,30000)}"""

أعد JSON فقط بلا أي نص آخر، بهذا الشكل:
{"programs":[{"title":"اسم البرنامج","type":"برنامج|لقاء|حفل|اختبار|اجتماع","stage":"تمهيدي|ابتدائي|متوسط|ثانوي|جامعي|الكبار|جميع المراحل|","mode":"فردي|جماعي|","desc":"وصف البرنامج","goal":"الأهداف، كل هدف في سطر","benef":عدد المستفيدين أو null,"date":{"cal":"hijri|gregorian","y":1448,"m":5,"d":21} أو null,"end":نفس شكل date أو null,"week":رقم الأسبوع الدراسي إن ذُكر الأسبوع فقط أو null}]}

قواعد مهمة:
- استخرج كل برنامج مذكور في الخطة دون أن تدمج برنامجين في واحد، ودون تكرار.
- type: اختر الأقرب من الخمسة: الحفلات والتكريم "حفل"، الاختبارات والمسابقات التقييمية "اختبار"، الاجتماعات الإدارية "اجتماع"، اللقاءات والمحاضرات والكلمات "لقاء"، وما عدا ذلك "برنامج".
- لا تخترع معلومة غير مكتوبة في الخطة: اترك النص فارغاً "" أو null إن لم تجدها.
- التاريخ كما هو مكتوب: هجري أو ميلادي، بالأرقام. إن ذُكر يوم وشهر دون سنة فاستعمل سنة الفصل. إن امتد البرنامج عدة أيام فضع النهاية في end.
- اكتب النصوص بالعربية كما وردت في الخطة مع تصحيح الأخطاء الإملائية الواضحة فقط.`;
}
const STAGE_ALIAS={'التمهيدي':'تمهيدي','الابتدائي':'ابتدائي','الابتدائية':'ابتدائي','المتوسط':'متوسط','المتوسطة':'متوسط','الثانوي':'ثانوي','الثانوية':'ثانوي','الجامعي':'جامعي','الجامعية':'جامعي','كبار':'الكبار','الكل':'جميع المراحل','جميع':'جميع المراحل'};
function h2g(h,term){
  if(!h||!h.y||!h.m||!h.d)return '';
  if(h.cal==='gregorian'){const s=`${h.y}-${String(h.m).padStart(2,'0')}-${String(h.d).padStart(2,'0')}`;return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:''}
  for(let d=addDays(term.start,-40);d<=addDays(term.end,40);d=addDays(d,1)){const p=hParts(d);if(p.year===+h.y&&p.month===+h.m&&p.day===+h.d)return d}
  return '';
}
function normImport(x,term){
  const st=STAGES.includes(x.stage)?x.stage:(STAGE_ALIAS[x.stage]||'');
  let start=h2g(x.date,term);if(!start&&x.week){const w=weekStart(term,+x.week);start=w<term.start?term.start:w}
  let end=h2g(x.end,term)||start;if(end<start)end=start;
  return {on:true,title:String(x.title||'').trim(),category:CATS.includes(x.type)?x.type:'',stage:st,kind:KINDS.includes(x.mode)?x.mode:'',desc:String(x.desc||'').trim(),goal:String(x.goal||'').trim(),benef:+x.benef>0?Math.round(+x.benef):'',start,end};
}
let IMP=null;
function reviewImport(items,cid,tid){
  IMP={items,cid,tid};const term=S.terms.find(t=>t.id===tid);
  const sel=(k,opts,v)=>`<select data-k="${k}"><option value="">—</option>${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
  const body=items.map((x,i)=>`<div class="imp-item" data-i="${i}">
    <div class="imp-h"><input type="checkbox" data-k="on" ${x.on?'checked':''} aria-label="تضمين البرنامج"><b class="small muted">${i+1}</b><input type="text" data-k="title" value="${esc(x.title)}" placeholder="اسم البرنامج"></div>
    <div class="imp-grid">
     <div><label class="l">نوع البرنامج</label>${sel('category',CATS,x.category)}</div>
     <div><label class="l">المرحلة</label>${sel('stage',STAGES,x.stage)}</div>
     <div><label class="l">فردي أو جماعي</label>${sel('kind',KINDS,x.kind)}</div>
     <div><label class="l">المستفيدون</label><input type="number" min="1" data-k="benef" value="${esc(x.benef)}"></div>
     <div><label class="l">التاريخ</label><input type="date" data-k="start" min="${term.start}" max="${term.end}" value="${x.start}"></div>
     <div><label class="l">ينتهي في</label><input type="date" data-k="end" min="${term.start}" max="${term.end}" value="${x.end!==x.start?x.end:''}"></div>
    </div>
    <label class="l">الوصف</label><textarea data-k="desc">${esc(x.desc)}</textarea>
    <label class="l" style="margin-top:4px">الأهداف</label><textarea data-k="goal">${esc(x.goal)}</textarea></div>`).join('');
  modal('مراجعة البرامج المستخرجة',`<div class="banner pri" style="margin-top:0"><div class="txt"><b>استُخرج ${items.length} برنامجاً من الخطة</b>راجعها، وأكمل الحقول المظللة بالأحمر، وألغِ تحديد ما لا تريد إضافته.</div></div><div id="impList">${body}</div>`,
   [['إضافة البرامج المحددة إلى الخطة','pri',saveImport]],true);
  markImport();
  document.querySelectorAll('#impList [data-k]').forEach(el=>el.addEventListener(el.type==='checkbox'?'change':'input',()=>{readImport();markImport()}));
}
function readImport(){document.querySelectorAll('#impList .imp-item').forEach(card=>{const x=IMP.items[+card.dataset.i];card.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;x[k]=k==='on'?el.checked:k==='benef'?(parseInt(el.value,10)||''):el.value.trim()});if(!x.end||x.end<x.start)x.end=x.start})}
function impMissing(x,term){return['title','stage','start'].filter(k=>!x[k]).concat(x.start&&(x.start<term.start||x.end>term.end)?['start']:[])}
function markImport(){const term=S.terms.find(t=>t.id===IMP.tid);document.querySelectorAll('#impList .imp-item').forEach(card=>{const x=IMP.items[+card.dataset.i];const m=impMissing(x,term);card.classList.toggle('off',!x.on);card.querySelectorAll('[data-k]').forEach(el=>el.classList.toggle('miss',x.on&&m.includes(el.dataset.k)))})}
function saveImport(){
  readImport();const term=S.terms.find(t=>t.id===IMP.tid);const on=IMP.items.map((x,i)=>({x,i})).filter(o=>o.x.on);
  if(!on.length){toast('لم تحدد أي برنامج');return false}
  const bad=on.filter(o=>impMissing(o.x,term).length).map(o=>o.i+1);
  if(bad.length){markImport();toast('أكمل الحقول المظللة في البرامج رقم: '+bad.join('، '));return false}
  return (async()=>{await q(sb.from('programs').insert(on.map(({x})=>({complex_id:IMP.cid,term_id:IMP.tid,title:x.title,category:x.category,stage:x.stage,kind:x.kind,descr:x.desc,goal:x.goal,benef:+x.benef||null,start_date:x.start,end_date:x.end||x.start}))));
  if(!planOf(IMP.cid,IMP.tid))await q(sb.from('plans').insert({complex_id:IMP.cid,term_id:IMP.tid,status:'draft'}));
  toast('أُضيف '+on.length+' برنامجاً إلى الخطة');IMP=null;await refresh();return true})();
}

/* ---------- modal & toast ---------- */
function modal(title,body,buttons,wide){
  closeModal();const bg=document.createElement('div');bg.className='modal-bg';bg.id='mbg';
  bg.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${title}</h3><button class="xbtn" aria-label="إغلاق" onclick="closeModal()">×</button></div><div class="modal-b">${body}</div>${buttons&&buttons.length?`<div class="modal-f"></div>`:''}</div>`;
  document.body.appendChild(bg);
  const f=bg.querySelector('.modal-f');(buttons||[]).forEach(([l,c,fn])=>{const b=document.createElement('button');b.className='btn '+(c||'');b.textContent=l;b.onclick=async()=>{if(b.disabled)return;b.disabled=true;busy(true);let r;try{r=await fn()}catch(e){toast(errMsg(e));r=false}busy(false);if(!document.body.contains(b))return;b.disabled=false;if(r!==false&&b.closest('#mbg'))closeModal()};f.appendChild(b)});
  bg.addEventListener('click',e=>{if(e.target===bg)closeModal()});
  const first=bg.querySelector('input:not([type=file]),textarea,select');if(first&&window.innerWidth>820)first.focus();
}
function closeModal(){$('#mbg')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('.lightbox')?.remove();closeModal()}if(e.key==='Enter'&&e.target.classList?.contains('prog'))e.target.click()});
let tT;function toast(m){$('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;document.body.appendChild(d);clearTimeout(tT);tT=setTimeout(()=>d.remove(),3200)}

(async()=>{$('#app').innerHTML='<div class="boot">جارٍ التحميل…</div>';
  try{const {data}=await sb.auth.getSession();if(data.session){session={uid:data.session.user.id};await loadAll();if(!me())session=null;else if(me().role==='judge'){location.replace('kc.html');return}}}catch(e){session=null}
  render()})();
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&session){session=null;S=emptyState();render()}});
</script>

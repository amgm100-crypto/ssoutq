<style>
:root{
  --bg:#F7F5F0;--surface:#FFFFFF;--surface2:#F0E6DF;--ink:#14141F;--muted:#43434C;--line:#D0D0D2;
  --primary:#14141F;--primary-ink:#F7F5F0;--primary-soft:#E0CEBE;
  --gold:#B2845D;--gold-soft:#F0E6DF;
  --ok:#2F6B47;--ok-soft:#E3EEE6;--warn:#8A5A1C;--warn-soft:#F0E6DF;--bad:#A3322A;--bad-soft:#F6E2DF;
  --shadow:none;
  --f-ui:"29LT Bukra","Readex Pro",Tahoma,"Segoe UI",Arial,sans-serif;
  --f-display:var(--f-ui);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14141F;--surface:#1B1B28;--surface2:#232331;--ink:#F7F5F0;--muted:#D0D0D2;--line:#43434C;
    --primary:#B2845D;--primary-ink:#14141F;--primary-soft:#2E2A2A;
    --gold:#C19D7D;--gold-soft:#2E2A2A;
    --ok:#8FCBA4;--ok-soft:#1E2E25;--warn:#E0CEBE;--warn-soft:#2E2A2A;--bad:#F0A39C;--bad-soft:#3A2224;
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14141F;--surface:#1B1B28;--surface2:#232331;--ink:#F7F5F0;--muted:#D0D0D2;--line:#43434C;
    --primary:#B2845D;--primary-ink:#14141F;--primary-soft:#2E2A2A;
    --gold:#C19D7D;--gold-soft:#2E2A2A;
    --ok:#8FCBA4;--ok-soft:#1E2E25;--warn:#E0CEBE;--warn-soft:#2E2A2A;--bad:#F0A39C;--bad-soft:#3A2224;
    --shadow:none;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}

/* ---------- login (بنمط بوابة الدخول الموحد) ---------- */
.login-page{min-height:100vh;background:#14141F;color:#F7F5F0;display:flex;flex-direction:column}
.login{flex:1;display:grid;grid-template-columns:1.1fr 1fr;max-width:1100px;width:100%;margin:0 auto;align-items:center;gap:40px;padding:48px 24px}
.login-brand{display:flex;flex-direction:column;align-items:flex-start;gap:26px}
.login-brand img{width:210px;height:auto}
.ayah{font-family:"Amiri","Traditional Arabic",serif;font-size:34px;line-height:2.1;margin:0;color:#F7F5F0}
.ayah-ref{font-size:14px;color:#B2845D;margin-top:-14px}
.login-box{background:#F7F5F0;color:#14141F;border-top:4px solid #B2845D;padding:32px 28px;width:100%;max-width:420px;justify-self:end}
.login-box h1{font-size:22px;font-weight:700;margin:0 0 4px}
.login-box .sub{margin:0 0 22px;color:#43434C;font-size:14px}
.login-box .field label{color:#43434C}
.login-box .field input{background:#fff;border-color:#D0D0D2;color:#14141F}
.login-box .btn.pri{background:#14141F;border-color:#14141F;color:#F7F5F0}
.demo{margin-top:18px;background:#F0E6DF;padding:12px 14px;font-size:13px;line-height:1.8;color:#14141F}
.demo b{font-weight:600}
.login-foot{border-top:1px solid #43434C;max-width:1100px;width:100%;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#A1A1A5}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:#14141F}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 18px}
.top-in .logo{height:38px;width:auto;flex:none}
.top .btn{background:transparent;color:#F7F5F0;border-color:#43434C}
.top .who{color:#D0D0D2}.top .who b{color:#F7F5F0}
.brand{border-inline-start:1px solid #43434C;padding-inline-start:12px}
@media (max-width:560px){.brand{display:none}}
.brand{line-height:1.3;min-width:0}
.brand b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:#D0D0D2}
.top .spacer{flex:1}
.who{font-size:13px;color:var(--muted);text-align:left;line-height:1.35}
.who b{display:block;color:var(--ink);font-weight:600}
.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px 1fr;gap:24px;padding:20px 18px 40px}
.nav{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:0;cursor:pointer;text-align:right;color:var(--muted);font-weight:500}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--surface)}
.nav button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
main{min-width:0}
.bottom-nav{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;padding:14px 12px 96px}
  .nav{display:none}
  .who{display:none}
  .bottom-nav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bottom-nav{overflow-x:auto;justify-content:flex-start!important}
  .bottom-nav button{flex:1 0 58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 2px;cursor:pointer}
  .bottom-nav button svg{width:22px;height:22px}
  .bottom-nav button.on{color:var(--primary);font-weight:600}
}

/* ---------- common ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.page-h h2{font-family:var(--f-display);font-size:26px;font-weight:700;margin:0;line-height:1.25}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:0;padding:18px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:16px;font-weight:600}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h3{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:0;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:0}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface2);border-radius:0;padding:9px 12px;width:100%;min-height:42px}
.field input[type=radio],.field input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--primary);flex:none}
.field textarea{min-height:90px;resize:vertical;line-height:1.7}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.field .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:0;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.pri{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:13px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.bar{height:7px;background:var(--surface2);border-radius:0;overflow:hidden;min-width:70px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--primary);border-radius:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:0;padding:5px 14px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

.day-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.day-name{font-size:15px;opacity:.85}
.day-hijri{font-family:var(--f-display);font-size:38px;line-height:1.25;font-weight:700;margin:2px 0}
.day-greg{font-size:14px;opacity:.8}
.day-week{border:1px solid #43434C;padding:10px 18px;min-width:150px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.day-week span{font-size:12px;color:#D0D0D2}
.day-week em{font-style:normal;font-size:12px;color:#D0D0D2;margin-top:2px}
.day-week b{display:block;font-size:34px;font-weight:700;color:#B2845D;line-height:1.1}
.day-week b small{font-size:15px;color:#D0D0D2;font-weight:400}
.day-nav{display:flex;gap:6px;margin-top:16px;padding-top:16px;border-top:1px solid #43434C;position:relative;z-index:1;flex-wrap:wrap;align-items:center}
.day-nav button,.day-nav input{background:transparent;border:1px solid #727279;color:#F7F5F0;border-radius:0;padding:5px 12px;font-size:13px;cursor:pointer}
.day-nav input{color-scheme:dark;min-height:32px}
.day-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px;position:relative;z-index:1}
.day-nums div{border:1px solid #43434C;padding:8px 12px;display:flex;align-items:baseline;gap:8px}
.day-nums span{font-size:13px;color:#D0D0D2}
.day-nums b{font-size:24px;font-weight:700;line-height:1.2;color:#B2845D}
@media (max-width:640px){.day-nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.day{padding:18px 18px 56px}.day::after{height:34px}.day-hijri{font-size:30px}.day-week{flex-direction:row;gap:8px;min-width:0;width:100%;justify-content:center}.day-week b{font-size:24px}}

.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:1fr}}

/* complex block in day view */
.cx{border-top:1px solid var(--line);padding:14px 0}
.cx:first-of-type{border-top:0;padding-top:2px}
.cx-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cx-h b{font-size:15px}
.prog{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:0;margin-bottom:8px;cursor:pointer;background:var(--surface)}
.prog:hover{border-color:var(--primary)}
.prog .dot{width:10px;height:10px;border-radius:50%;margin-top:8px;flex:none;background:var(--line)}
.prog .dot.ok{background:var(--ok)}.prog .dot.warn{background:var(--warn)}.prog .dot.bad{background:var(--bad)}.prog .dot.pri{background:var(--primary)}
.prog-b{flex:1;min-width:0}
.prog-t{font-weight:600}
.prog-m{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.alert-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.alert-item:last-child{border-bottom:0}

/* week group */
.wk{margin-bottom:14px}
.wk-h{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.wk-h b{font-family:var(--f-display);font-size:19px}
.wk-h span{font-size:12px;color:var(--muted)}
.wk.now .wk-h b{color:var(--gold)}

.banner{border-radius:0;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.pri{background:var(--primary-soft);color:var(--primary)}
.banner .txt{flex:1;min-width:200px}
.banner b{display:block}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gal figure{margin:0;border:1px solid var(--line);overflow:hidden;background:var(--surface);position:relative;display:flex;flex-direction:column}
.gal .thumb{aspect-ratio:4/3;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.gal .thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.gal .thumb.file{flex-direction:column;gap:6px;color:var(--muted);text-decoration:none;padding:8px}
.gal .thumb.file svg{width:34px;height:34px;color:var(--gold)}
.gal .thumb.file b{font-size:11px;color:var(--ink);background:var(--gold-soft);padding:1px 8px}
.gal .thumb.note{padding:10px;font-size:12px;color:var(--ink);text-align:center;line-height:1.6}
.gal figcaption{padding:6px 8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:1px;min-width:0}
.gal figcaption span{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal figcaption small{font-size:11px;color:var(--muted)}
.gal .x{position:absolute;top:6px;inset-inline-end:6px;background:rgba(20,20,31,.75);color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:16px;line-height:26px;padding:0;text-align:center}
.gal .x:hover{background:var(--bad)}
.ev-add{margin-top:16px;border:1px solid var(--line);padding:14px;background:var(--surface2)}
.ev-add h4{margin:0 0 10px;font-size:14px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--line);padding:18px 12px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.drop svg{width:30px;height:30px;color:var(--gold)}
.drop b{color:var(--ink);font-size:14px}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-soft)}
.ev-pend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ev-pend span{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:3px 4px 3px 10px;font-size:12px;max-width:100%}
.ev-pend span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.ev-pend button{border:0;background:var(--surface2);width:20px;height:20px;cursor:pointer;line-height:20px;padding:0}
.ev-add .row{margin-top:10px;justify-content:space-between}

/* meetings */
.dec{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.dec:last-child{border-bottom:0}
.dec-t{font-weight:500}
.dec-m{font-size:12px;color:var(--muted)}
.dec-row{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
.dec-row input,.dec-row select{border:1px solid var(--line);background:var(--surface2);border-radius:0;padding:7px 9px;min-width:0;width:100%}
@media (max-width:640px){.dec-row{grid-template-columns:1fr 1fr;padding:8px;border:1px solid var(--line);border-radius:0}.dec-row input:first-child{grid-column:1/-1}}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:0;padding:10px;background:var(--surface2)}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:400;color:var(--ink)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,19,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(30px + env(safe-area-inset-top,0px)) 12px 30px;overflow-y:auto}
.modal{background:var(--surface);border-radius:0;width:100%;max-width:640px;animation:pop .16s ease-out}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:17px}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-start;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.xbtn{border:0;background:var(--surface2);border-radius:0;width:32px;height:32px;cursor:pointer;font-size:18px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-height:90vh;border-radius:0}

.demo-bar{background:#B2845D;color:#14141F;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));font-size:13px}
.demo-bar span{flex-basis:100%;font-weight:500}
@media (min-width:820px){.demo-bar span{flex:0 1 auto;flex-basis:auto;margin-inline-end:6px}}
.demo-bar button,.demo-bar select{background:transparent;border:1px solid #14141F;color:#14141F;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px;border-radius:0}
.demo-bar button[aria-pressed="true"]{background:#14141F;color:#F7F5F0}
.demo-bar select{max-width:190px}
@media print{.demo-bar{display:none}}
/* calendar */
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-bar h3{margin:0;font-size:20px;font-weight:700;min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-inline-start:1px solid var(--line)}
.cal-wd{font-size:12px;font-weight:600;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);background:var(--surface2);text-align:center}
.cal-d{min-height:104px;border:0;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);background:var(--surface);padding:6px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit;color:inherit;min-width:0}
.cal-d:hover{background:var(--surface2)}
.cal-d.out{background:var(--bg);cursor:default}
.cal-d.we{background:var(--bg)}
.cal-d.sel{outline:2px solid var(--gold);outline-offset:-2px}
.cal-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.cal-h{font-weight:700;font-size:15px;line-height:1.4;padding:0 5px}
.cal-d.today .cal-h{background:var(--primary);color:var(--primary-ink)}
.cal-g{font-size:10px;color:var(--muted)}
.cal-t{font-size:11px;line-height:1.5;padding:1px 5px;background:var(--primary-soft);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-inline-start:3px solid var(--primary)}
.cal-t.warn{background:var(--warn-soft);border-color:var(--warn)}.cal-t.ok{background:var(--ok-soft);border-color:var(--ok)}.cal-t.bad{background:var(--bad-soft);border-color:var(--bad)}
.cal-more{font-size:11px;color:var(--muted);padding:0 5px}
.cal-n{display:none;font-size:12px;font-weight:700;background:var(--gold);color:#14141F;align-self:flex-start;padding:0 7px;margin-top:auto}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.cal-legend i{display:inline-block;width:10px;height:10px;margin-inline-end:4px;vertical-align:middle}
@media (max-width:700px){.cal-d{min-height:64px;padding:4px 3px}.cal-t,.cal-more,.cal-g{display:none}.cal-n{display:inline-block}.cal-h{font-size:14px}.cal-bar h3{font-size:17px;min-width:0}}
.prog.evt{background:var(--gold-soft);border-inline-start:4px solid var(--gold)}
.prog.evt .dot{background:var(--gold)}
.cal-t.evt{background:var(--gold-soft);border-color:var(--gold);font-weight:600}
.imp-item{border:1px solid var(--line);padding:12px;margin-bottom:10px;background:var(--surface)}
.imp-item.off{opacity:.5}
.imp-item .imp-h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.imp-item .imp-h input[type=text]{flex:1;font-weight:600}
.imp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:6px}
.imp-item input,.imp-item select,.imp-item textarea{border:1px solid var(--line);background:var(--surface2);padding:6px 8px;width:100%;min-width:0;font-size:13px}
.imp-item textarea{min-height:52px;resize:vertical}
.imp-item .miss{border-color:var(--bad);background:var(--bad-soft)}
.imp-item label.l{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
@media (max-width:640px){.imp-grid{grid-template-columns:1fr 1fr}}
.progress{height:6px;background:var(--surface2);overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:var(--gold);transition:width .3s}
/* wisam */
.w-head{background:#14141F;color:#F7F5F0;padding:22px 24px;display:flex;gap:20px;align-items:center;margin-bottom:16px;border-bottom:4px solid #B2845D;flex-wrap:wrap}
.w-logo{background:#F7F5F0;padding:10px 14px;flex:none}
.w-logo img{height:74px;display:block}
.w-head h2{margin:0;font-size:26px;font-weight:700;line-height:1.3}
.w-head p{margin:2px 0 0;color:#D0D0D2;font-size:14px}
.w-head .k{color:#B2845D;font-size:13px;font-weight:600}
.w-head .sp{flex:1}
.w-head .btn{background:transparent;color:#F7F5F0;border-color:#727279}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);padding:12px 14px}
.kpi.dk{background:#14141F;color:#F7F5F0;border-color:#14141F;border-top-color:#B2845D}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted);display:block}
.kpi.dk span{color:#D0D0D2}
.kpi small{font-size:12px;color:var(--gold);display:block;margin-top:2px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis .kpi:first-child{grid-column:1/-1}}
.wt td{padding:8px 10px}
.wt .cxc{display:flex;align-items:center;gap:10px;min-width:190px}
.wt .lg{width:58px;height:40px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff;border:1px solid var(--line)}
.wt .lg img{max-width:52px;max-height:34px}
.wt .lg.ph{font-weight:700;color:#B2845D}
.wt .nm b{display:block;font-size:14px}
.wt .nm span{font-size:11px;color:var(--muted)}
.mb{display:flex;align-items:center;gap:8px;min-width:120px}
.mb b{width:44px;font-size:14px;text-align:left}
.mb i{flex:1;height:8px;background:var(--surface2);display:block;overflow:hidden}
.mb i s{display:block;height:100%;background:var(--ink)}
.mb.g i s{background:var(--gold)}
.mb.d i s{background:#727279}
.wt td.n{font-weight:700;font-size:15px;white-space:nowrap}
.wt tr.mine td{background:var(--gold-soft)}
.wt tr.mine td:first-child{box-shadow:inset -4px 0 0 var(--gold)}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;background:var(--surface2);font-size:12px;font-weight:700}
.rank.r1{background:#B2845D;color:#14141F}
.tops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:900px){.tops{grid-template-columns:1fr}}
.wtop{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-inline-start:4px solid var(--gold);padding:8px 10px;background:var(--surface)}
.wtop .lg{width:44px;height:34px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.wtop .lg img{max-width:40px;max-height:30px}
.wtop .t{flex:1;min-width:0}
.wtop .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtop .t span{font-size:12px;color:var(--muted)}
.wtop .pt{background:#14141F;color:#F7F5F0;padding:2px 10px;text-align:center;font-weight:700}
.wtop .pt small{display:block;font-size:10px;color:#D0D0D2;font-weight:400}
.notes{font-size:13px;color:var(--muted);line-height:1.9}
.notes b{color:var(--ink)}
.perm-list{border:1px solid var(--line)}
.perm{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:400;color:var(--ink)}
.perm:last-child{border-bottom:0}
.perm b{display:block;font-size:14px}.perm small{font-size:12px;color:var(--muted);font-weight:400}
.field input.sw,input.sw{appearance:none;-webkit-appearance:none;width:42px!important;height:24px!important;min-height:0;padding:0;border:1px solid var(--line);background:var(--surface2);position:relative;cursor:pointer;flex:none;border-radius:999px}
input.sw::after{content:"";position:absolute;top:2px;right:2px;width:18px;height:18px;background:var(--muted);border-radius:50%;transition:right .15s}
input.sw:checked{background:var(--gold);border-color:var(--gold)}
input.sw:checked::after{right:20px;background:#fff}
.cxl{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff;border:1px solid var(--line);overflow:hidden;vertical-align:middle}
.cxl img{max-width:88%;max-height:88%;object-fit:contain}
.cxl.mono{background:#14141F;color:#B2845D;font-weight:700;border-color:#14141F}
.cx-h .cxl{margin-inline-end:2px}
.cxname{display:flex;align-items:center;gap:10px}
.top .cxl{border-color:#43434C}
.logo-edit{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#busy{position:fixed;inset:0 0 auto;height:3px;z-index:90;overflow:hidden;background:transparent}
#busy i{display:block;height:100%;width:30%;background:#B2845D;animation:bz 1s infinite linear}
@keyframes bz{from{transform:translateX(100%)}to{transform:translateX(-340%)}}
.boot{min-height:100vh;display:grid;place-items:center;background:#14141F;color:#D0D0D2;font-size:14px}
.evf{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0 10px}
@media (max-width:760px){.evf{grid-template-columns:1fr 1fr}}
.evsum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.evt td{font-size:13px}
.evt .tn{width:46px;height:36px;object-fit:cover;border:1px solid var(--line);display:block;background:var(--surface2)}
.evt .fi{width:46px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--gold-soft);color:var(--gold);font-size:10px;font-weight:700}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:0;z-index:70;font-size:14px;box-shadow:var(--shadow);max-width:90vw}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}

/* ---------- report ---------- */
.report{background:#F7F5F0;color:#14141F;border-radius:0;border:1px solid var(--line);padding:30px;max-width:900px;margin:0 auto}
.rep-head{display:flex;align-items:center;gap:18px;border-bottom:2px solid #14141F;padding-bottom:14px;margin-bottom:18px}
.rep-head img{height:78px;width:auto}
.rep-head h1{font-family:var(--f-display);margin:0;font-size:26px;line-height:1.3}
.rep-head p{margin:0;color:#5E6B69;font-size:13px}
.rep-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.rep-kpis div{border:1px solid #DCE3DF;border-radius:0;padding:10px 12px}
.rep-kpis b{display:block;font-size:24px;color:#B2845D;line-height:1.2}
.rep-kpis span{font-size:12px;color:#5E6B69}
.report h2{font-size:17px;margin:22px 0 10px;color:#B2845D}
.report table th{color:#5E6B69;border-color:#DCE3DF}
.report table td{border-color:#DCE3DF}
.rep-bars div{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}

@media print{
  body{background:#fff}
  .top,.nav,.nav-ov,.bottom-nav,.no-print,.page-h,.demo-bar,body::before{display:none!important}

/* ---------- الطلبات الإلكترونية ---------- */
.nbadge{font-style:normal;background:var(--gold);color:#14141F;font-size:11px;font-weight:700;padding:0 6px;margin-inline-start:4px}
.rq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rq-tile{display:flex;flex-direction:column;gap:4px;text-align:right;border:1px solid var(--line);border-inline-start:4px solid var(--gold);background:var(--surface);padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.rq-tile:hover{background:var(--surface2)}
.rq-tile b{font-size:15px}.rq-tile span{font-size:13px;color:var(--muted)}.rq-tile small{font-size:11px;color:var(--gold);font-weight:600}
.rq-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.rq-wide{grid-column:1/-1}
.rq-h{grid-column:1/-1;margin:10px 0 8px;font-size:15px;border-bottom:2px solid var(--gold);padding-bottom:4px}
.rq-opts{display:flex;flex-wrap:wrap;gap:6px 14px}
.rq-opt{display:flex;align-items:center;gap:6px;font-weight:400!important;color:var(--ink)!important;font-size:14px!important}
.rq-nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.rq-nums label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.rq-nums input{border:1px solid var(--line);background:var(--surface2);padding:6px 8px}
.rq-tbl{width:100%;border-collapse:collapse}.rq-tbl th,.rq-tbl td{border:1px solid var(--line);padding:6px 8px;font-size:13px}
.rq-tbl input{width:100%;border:0;background:transparent;padding:4px;min-width:90px}
.rq-view{width:100%;border-collapse:collapse}.rq-view th{width:34%;background:var(--surface2);vertical-align:top}.rq-view td,.rq-view th{border:1px solid var(--line);padding:8px 10px}
.rq-sec{background:#14141F!important;color:#F7F5F0!important;text-align:right}
.sigpad canvas{width:100%;max-width:520px;height:150px;border:1px dashed var(--gold);background:#fff;touch-action:none;display:block;cursor:crosshair}
.sigimg{max-height:60px;max-width:220px;background:#fff;border:1px solid var(--line);display:block;margin-top:4px}
.rq-step{border-inline-start:3px solid var(--line);padding:2px 0 10px 0;padding-inline-start:12px;margin-inline-start:6px}
.rq-step.done{border-color:var(--ok)}.rq-step.cur{border-color:var(--gold)}.rq-step.skip{opacity:.5}
.rq-step-h{display:flex;align-items:center;gap:8px}.rq-step-h b{flex:1;font-size:14px}
.rq-dot{width:12px;height:12px;border-radius:50%;background:var(--line);margin-inline-start:-19px;flex:none}
.rq-step.done .rq-dot{background:var(--ok)}.rq-step.cur .rq-dot{background:var(--gold)}
.rq-sig{border:1px solid var(--line);padding:8px 10px;margin-top:6px;background:var(--surface2)}.rq-sig.ok{background:var(--surface)}
.rq-sig p{margin:4px 0;font-size:13px;white-space:pre-line}.rq-sig .chip{margin-inline-end:4px}
.rq-print .rq-step{break-inside:avoid}
.iv-tbl{margin-bottom:10px}.iv-tbl input{width:80px!important;border:1px solid var(--line)!important;background:var(--surface2)!important;text-align:center}
.iv-total{font-size:16px;margin:6px 0 12px;padding:8px 12px;background:#14141F;color:#F7F5F0;display:inline-block}.iv-total b{color:#B2845D;font-size:20px}
.iv-mem{border:1px solid var(--line);padding:10px;margin-bottom:8px;background:var(--surface2)}
.iv-view details{margin:6px 0}.iv-view summary{cursor:pointer;color:var(--gold)}
.iv-mems{display:flex;gap:10px;flex-wrap:wrap}
.lh{background:#fff;color:#14141F;padding:18px 22px 0;font-size:13px}
.lh-top{display:flex;align-items:center;gap:14px;border-bottom:2px solid #14141F;padding-bottom:10px}
.lh-top img{height:64px}.lh-t{flex:1}.lh-t b{display:block;font-size:16px}.lh-t span{color:#B2845D;font-weight:600}
.lh-l{font-size:11px;color:#43434C;text-align:left}
.lh-h{text-align:center;font-size:18px;margin:12px 0 6px}
.lh-meta{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:12px;color:#43434C;margin-bottom:10px}

/* =========================================================
   منصة إدارة المجمعات والحلق – جمعية مدكر لتحفيظ القرآن الكريم بعنيزة
   نسخة معاينة: البيانات محفوظة في هذا المتصفح فقط
   ========================================================= */
const CATS=['برنامج','لقاء','حفل','اختبار','اجتماع','أخرى'];
const STAGES=['تمهيدي','ابتدائي','متوسط','ثانوي','جامعي','الكبار','جميع المراحل','المعلمون والعاملون'];
const KINDS=['فردي','جماعي'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>iso(new Date());
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function pd(s){return new Date(s+'T12:00:00')}
const fH=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'});
const fHs=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'short'});
const fG=new Intl.DateTimeFormat('ar-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'});
const fDay=new Intl.DateTimeFormat('ar',{weekday:'long'});
const hijri=s=>s?fH.format(pd(s)).replace(' هـ','هـ'):'';
const hijriS=s=>s?fHs.format(pd(s)):'';
const greg=s=>s?fG.format(pd(s)):'';
const dayName=s=>fDay.format(pd(s));

async function planAct(pid,st,note){const p=S.plans.find(x=>x.id===pid);await q(sb.from('plans').update({status:st,note:note!==undefined?note:p.note,updated_at:new Date().toISOString()}).eq('id',pid));toast(st==='approved'?'اعتُمدت الخطة':'أُعيدت الخطة للمجمع');await refresh()}

async function planSubmit(cid,tid){const inc=S.programs.filter(x=>x.complexId===cid&&x.termId===tid&&progMissing(x).length).length;if(inc){toast('أكمل بيانات '+inc+' برنامجاً قبل رفع الخطة (المعلّمة «بيانات ناقصة»)');return}

function editProgram(id,cid,tid){
  const p=id?S.programs.find(x=>x.id===id):{title:'',category:'',stage:'',kind:'',desc:'',goal:'',benef:'',start:todayISO(),end:''};
  const term=S.terms.find(t=>t.id===(p.termId||tid));
  const req='<span style="color:var(--bad)"> *</span>';
  modal(id?'تعديل البرنامج':'إضافة برنامج',`
   <div class="field"><label for="pt">اسم البرنامج${req}</label><input id="pt" value="${esc(p.title)}"></div>
   <div class="grid2">
    <div class="field"><label for="pst">المرحلة${req}</label><select id="pst"><option value="">اختر المرحلة</option>${STAGES.map(c=>`<option ${c===p.stage?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>فردي أو جماعي</label><div class="row" style="min-height:42px">${KINDS.map(k=>`<label class="row" style="font-weight:500;color:var(--ink)"><input type="radio" name="pk" value="${k}" ${k===p.kind?'checked':''}> ${k}</label>`).join('')}</div></div>
   </div>
   <div class="field"><label for="pd">وصف البرنامج</label><textarea id="pd" placeholder="ماذا سيحدث في البرنامج، ومتى، وأين">${esc(p.desc)}</textarea></div>
   <div class="field"><label for="pgo">أهداف البرنامج</label><textarea id="pgo" placeholder="هدف في كل سطر">${esc(p.goal)}</textarea></div>
   <div class="grid2">
    <div class="field"> <label for="pb">عدد المستفيدين</label><input id="pb" type="number" min="0" inputmode="numeric" value="${esc(p.benef)}"></div>
    <div class="field"><label for="pc">نوع البرنامج</label><select id="pc"><option value="">—</option>${CATS.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label for="ps">تاريخ التنفيذ${req}</label><input id="ps" type="date" min="${term.start}" max="${term.end}" value="${p.start}"><span class="hint" id="psh">${hijri(p.start)}</span></div>
    <div class="field"><label for="pe">ينتهي في (إن امتد أكثر من يوم)</label><input id="pe" type="date" min="${term.start}" max="${term.end}" value="${p.end&&p.end!==p.start?p.end:''}"><span class="hint" id="peh">${p.end&&p.end!==p.start?hijri(p.end):''}</span></div>
   </div>
   <p class="small muted" style="margin:0">الفصل: ${hijri(term.start)} – ${hijri(term.end)}</p>`,
   [[id?'حفظ التعديل':'إضافة البرنامج','pri',async()=>{
      const v={title:$('#pt').value.trim(),stage:$('#pst').value,kind:document.querySelector('input[name=pk]:checked')?.value||'',desc:$('#pd').value.trim(),goal:$('#pgo').value.trim(),benef:parseInt($('#pb').value,10)||0,category:$('#pc').value,start:$('#ps').value,end:$('#pe').value||$('#ps').value};
      const miss=[!v.title&&'اسم البرنامج',!v.stage&&'المرحلة',!v.start&&'التاريخ'].filter(Boolean);
      if(miss.length){toast('أكمل: '+miss.join('، '));return false}
      if(v.start<term.start||v.end>term.end){toast('التاريخ خارج أيام الفصل الدراسي');return false}
      if(v.end<v.start){toast('تاريخ النهاية قبل البداية');return false}
      const row={title:v.title,category:v.category,stage:v.stage,kind:v.kind,descr:v.desc,goal:v.goal,benef:v.benef||null,start_date:v.start,end_date:v.end};
      if(id)await q(sb.from('programs').update(row).eq('id',id));
      else{await q(sb.from('programs').insert(Object.assign({complex_id:cid,term_id:tid},row)));if(!planOf(cid,tid))await q(sb.from('plans').insert({complex_id:cid,term_id:tid,status:'draft'}))}
      toast(id?'حُفظ التعديل':'أُضيف البرنامج');await refresh();return true}]],true);
  ['ps','pe'].forEach(k=>$('#'+k).oninput=e=>$('#'+k+'h').textContent=hijri(e.target.value));
}
function openProgram(id){
  const p=S.programs.find(x=>x.id===id);if(!p)return;
  const admin=!(isCx()&&me().complexId===p.complexId);const s=progState(p);const pl=planOf(p.complexId,p.termId);
  const editable=!admin&&(!pl||pl.status==='draft'||pl.status==='returned');
  const evs=evOf(id);const term=S.terms.find(t=>t.id===p.termId);
  const ic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>';
  const ext=n=>(String(n).split('.').pop()||'').toUpperCase().slice(0,4);
  const gal=evs.map(e=>`<figure>${e.type==='image'?`<div class="thumb"><img data-ev="${esc(e.path)}" alt="${esc(e.caption||e.name)}" onclick="if(this.src)lightbox(this.src)"></div>`:`<a class="thumb file" data-evf="${esc(e.path)}" href="#" target="_blank" rel="noopener" download="${esc(e.name)}" title="فتح الملف">${ic}<b>${esc(ext(e.name))}</b></a>`}
    <figcaption><span>${esc(e.type==='note'?'تقرير مختصر':(e.caption||e.name))}</span><small>${hijriS(e.at)}</small></figcaption>${!admin?`<button class="x" title="حذف الشاهد" aria-label="حذف الشاهد" onclick="delEv('${e.id}','${id}')">×</button>`:''}</figure>`).join('');
  const btns=[];
  if(!admin){
    if(editable)btns.push(['تعديل','',()=>{closeModal();editProgram(id);return false}]);
    if(editable)btns.push(['حذف البرنامج','danger',()=>{ask('حذف البرنامج','سيُحذف البرنامج وكل شواهده.','حذف',async()=>{const paths=evs.map(e=>e.path);if(paths.length)await sb.storage.from('evidence').remove(paths);await q(sb.from('programs').delete().eq('id',id));toast('حُذف البرنامج');await refresh()});return false}]);
    if(p.status!=='missed')btns.push(['لم يُنفّذ','danger',()=>{ask('تسجيل البرنامج غير منفّذ','','تسجيل',async r=>{await q(sb.from('programs').update({status:'missed',reason:r}).eq('id',id));toast('سُجّل البرنامج غير منفّذ');await refresh()},'سبب عدم التنفيذ');return false}]);
    else btns.push(['إلغاء «لم يُنفّذ»','',async()=>{await q(sb.from('programs').update({status:evs.length?'done':'planned',reason:''}).eq('id',id));await refresh();return true}]);
  }
  modal(esc(p.title),`
   <div class="row" style="margin-bottom:12px"><span class="chip ${s.c}">${s.l}</span><span class="chip">${esc(p.category)}</span>${term?`<span class="chip gold">${wkLabel(term,p.start)}</span>`:''}</div>
   <dl class="kv"><dt>المجمع</dt><dd>${esc(cxName(p.complexId))}</dd><dt>التاريخ</dt><dd>${dayName(p.start)} ${hijri(p.start)}${p.end!==p.start?' إلى '+hijri(p.end):''}<br><span class="small muted">${greg(p.start)}م</span></dd>
   <dt>المرحلة</dt><dd>${esc(p.stage||'—')}</dd><dt>فردي أو جماعي</dt><dd>${esc(p.kind||'—')}</dd><dt>المستفيدون</dt><dd>${esc(p.benef||'—')}</dd>${p.desc?`<dt>الوصف</dt><dd style="white-space:pre-line">${esc(p.desc)}</dd>`:''}${p.goal?`<dt>الأهداف</dt><dd style="white-space:pre-line">${esc(p.goal)}</dd>`:''}${p.reason?`<dt>سبب عدم التنفيذ</dt><dd>${esc(p.reason)}</dd>`:''}${p.note?`<dt>ملاحظة</dt><dd>${esc(p.note)}</dd>`:''}</dl>
   ${progMissing(p).length?`<div class="banner bad" style="margin:0 0 10px"><div class="txt"><b>بيانات ناقصة</b>${progMissing(p).join('، ')}</div></div>`:''}
   <h3 style="font-size:15px;margin:16px 0 8px">الشواهد (${evs.length})</h3>
   ${gal?`<div class="gal">${gal}</div>`:`<p class="small muted">لم يُرفع شاهد بعد.</p>`}
   ${!admin&&p.status!=='missed'?`<div class="ev-add"><h4>إضافة شاهد</h4>
     <label class="drop" for="evf" id="evdrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><b>اختر الصور أو الملفات</b><span>أو اسحبها إلى هنا · صور، PDF، Word · الصور تُضغط تلقائياً</span></label>
     <input id="evf" type="file" multiple accept="image/*,.pdf,.doc,.docx" class="hidden">
     <div class="ev-pend" id="evpend"></div>
     <div class="field" style="margin:10px 0 0"><label for="evc">وصف مختصر للشاهد (اختياري)</label><input id="evc" placeholder="مثال: حضر 35 طالباً"></div>
     <div class="row"><span class="small muted" id="evcount">لم تُختر ملفات بعد</span><button type="button" class="btn pri" id="evup" disabled>رفع الشواهد</button></div></div>`:''}`,btns,true);
  const f=$('#evf');if(f){let pend=[];const drop=$('#evdrop');
    const show=()=>{$('#evpend').innerHTML=pend.map((x,i)=>`<span><em>${esc(x.name)}</em><button type="button" aria-label="إزالة" data-i="${i}">×</button></span>`).join('');$('#evcount').textContent=pend.length?pend.length+' ملف جاهز للرفع':'لم تُختر ملفات بعد';$('#evup').disabled=!pend.length;
      document.querySelectorAll('#evpend button').forEach(b=>b.onclick=()=>{pend.splice(+b.dataset.i,1);show()})};
    const add=list=>{pend=pend.concat([...list]);show()};
    f.onchange=()=>{add(f.files);f.value=''};
    ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
    ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
    drop.addEventListener('drop',e=>add(e.dataTransfer.files));
    $('#evup').onclick=()=>{$('#evup').disabled=true;$('#evup').textContent='جارٍ الرفع…';uploadEv(pend,p,$('#evc').value.trim())};}
  hydrateEv();
}
async function uploadEv(files,p,cap){
  let n=0;busy(true);
  for(const file of files){
    try{
      let blob=file,type='file',ext=(file.name.split('.').pop()||'bin').toLowerCase(),ct=file.type||'application/octet-stream';
      if(file.type.startsWith('image/')){blob=await compressBlob(file);type='image';ext='jpg';ct='image/jpeg'}
      else if(file.size>10e6){toast('الملف '+file.name+' أكبر من 10 م.ب');continue}
      const path=`${p.complexId}/${p.id}/${uid()}.${ext}`;
      await q(sb.storage.from('evidence').upload(path,blob,{contentType:ct,upsert:false}));
      await q(sb.from('evidence').insert({program_id:p.id,complex_id:p.complexId,name:file.name,type,path,caption:cap}));n++;
    }catch(e){toast('تعذّر رفع '+file.name+': '+errMsg(e))}
  }
  try{if(n&&p.status!=='done'&&p.status!=='missed')await q(sb.from('programs').update({status:'done'}).eq('id',p.id))}catch(e){}
  busy(false);
  if(n){toast(n===1?'رُفع الشاهد':'رُفعت '+n+' شواهد');closeModal();await refresh();openProgram(p.id)}
  else{const b=$('#evup');if(b){b.disabled=false;b.textContent='رفع الشواهد'}}
}
function delEv(eid,pid){ask('حذف الشاهد','لا يمكن التراجع عن الحذف.','حذف',async()=>{const e=S.evidence.find(x=>x.id===eid);if(e)await sb.storage.from('evidence').remove([e.path]);await q(sb.from('evidence').delete().eq('id',eid));
  const p=S.programs.find(x=>x.id===pid);if(p&&p.status==='done'&&evOf(pid).length<=1)await q(sb.from('programs').update({status:'planned'}).eq('id',pid));await refresh();openProgram(pid)})}
function compressBlob(file){return new Promise(async(res,rej)=>{try{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const m=1400,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('img')),'image/jpeg',.75)};img.onerror=rej;img.src=url}catch(e){rej(e)}})}
const EVURL={};
async function hydrateEv(root){const els=[...(root||document).querySelectorAll('[data-ev],[data-evf]')];if(!els.length)return;
  const need=[...new Set(els.map(e=>e.dataset.ev||e.dataset.evf).filter(p=>!EVURL[p]||EVURL[p].t<Date.now()-3e6))];
  if(need.length){try{const d=await q(sb.storage.from('evidence').createSignedUrls(need,3600));d.forEach(x=>{if(x.signedUrl)EVURL[x.path]={u:x.signedUrl,t:Date.now()}})}catch(e){}}
  els.forEach(e=>{const u=EVURL[e.dataset.ev||e.dataset.evf]?.u;if(!u)return;if(e.dataset.ev)e.src=u;else e.href=u})}
const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
function compress(file){return new Promise(async(res,rej)=>{try{const url=await readURL(file);const img=new Image();img.onload=()=>{const m=1100,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.68))};img.onerror=rej;img.src=url}catch(e){rej(e)}})}
function lightbox(src){const d=document.createElement('div');d.className='lightbox';d.innerHTML=`<img src="${src}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d)}

  ${missing?`<div class="banner warn"><div class="txt"><b>${missing} مجمعاً بلا حساب مدير</b>لكل مجمع حساب واحد لمديره، ويستطيع مدير النظام إضافة حسابات أخرى من «تعديل»</div><button class="btn sm pri" onclick="createMissingAccounts()">إنشاء حسابات المديرين الناقصة</button></div>`:''}

/* ---------- تعيين كلمات المرور من ملف ---------- */
function accSlots(){const sl=[];
  S.complexes.forEach(c=>SUBS.forEach(([k,l])=>sl.push({group:c.name,label:l,kind:'complex',complexId:c.id,sub:k,users:S.users.filter(x=>x.complexId===c.id&&x.sub===k)})));
  S.departments.forEach(d=>{const us=S.users.filter(x=>x.role==='dept'&&x.deptId===d.id);sl.push({group:'الأقسام',label:d.name,kind:'dept',deptId:d.id,perms:us[0]?.perms||{},users:us})});
  return sl}
function accRows(){const rows=[];accSlots().forEach(s=>s.users.forEach(u=>rows.push({u,slot:s,group:s.group,label:s.label,name:userName(u)||''})));return rows}
const XLSX_SRC='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
async function exportAccounts(){busy(true);try{if(!window.XLSX)await loadScript(XLSX_SRC);
  const data=accRows().map(r=>({'اسم المستخدم':r.u.username,'الجهة':r.group,'الحساب':r.label,'اسم صاحب الحساب':r.name,'اسم المستخدم الجديد':'','كلمة المرور الجديدة':''}));
  const ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[16,30,30,26,20,24].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,'الحسابات');
  XLSX.writeFile(wb,'حسابات-المنصة.xlsx');toast('نُزّل ملف الحسابات. لا ترسله لأحد بعد تعبئته')}catch(e){toast(errMsg(e))}busy(false)}
function importPasswords(){

   <label class="drop" for="pwf">اختر ملف Excel أو CSV</label><input id="pwf" type="file" accept=".xlsx,.xls,.csv" class="hidden">
   <label class="row small" style="margin-top:10px"><input type="checkbox" id="pwforce"> إلزام أصحاب الحسابات بتغيير كلمة المرور عند أول دخول</label>
   <div id="pwrev" style="margin-top:12px"></div>`,[],true);
  $('#pwf').onchange=e=>{const f=e.target.files[0];if(f)readPasswords(f)}}
let PWROWS=[];
async function readPasswords(file){const box=$('#pwrev');box.innerHTML='<p class="small muted">جارٍ قراءة الملف…</p>';
  try{if(!window.XLSX)await loadScript(XLSX_SRC);
    const wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
    const hi=rows.findIndex(r=>r.some(c=>/اسم المستخدم/.test(String(c))));if(hi<0)throw new Error('لم أجد عمود «اسم المستخدم» في الملف');
    const hd=rows[hi].map(c=>String(c).trim());const col=re=>hd.findIndex(c=>re.test(c));
    const cu=col(/^اسم المستخدم$|^اسم المستخدم الحالي$/),cnu=col(/اسم المستخدم الجديد/),cp=col(/كلمة المرور/),cn=col(/اسم صاحب/),cg=col(/^الجهة/),cl=col(/^الحساب/);
    if(cp<0)throw new Error('لم أجد عمود «كلمة المرور الجديدة» في الملف');
    const slots=accSlots();const all=accRows();const used=new Set();const seen={},seenU={};
    const clean=s=>String(s??'').replace(/[‎‏‪-‮]/g,'').trim();
    const digits=s=>clean(s).replace(/\s/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    const lbl=s=>normAr(s).replace(/مدير|المجمع|مجمع/g,'');
    const findSlot=(g,l)=>{if(!g||!l)return null;const isDept=/الأقسام|قسم/.test(g)&&!/^مجمع/.test(g.trim());
      if(isDept){const n=normAr(l);const ds=slots.filter(s=>s.kind==='dept');return ds.find(s=>normAr(s.label)===n)||ds.find(s=>normAr(s.label).includes(n)||n.includes(normAr(s.label)))}
      const ng=normAr(g);const cs=slots.filter(s=>s.kind==='complex'&&(normAr(s.group)===ng||normAr(s.group).includes(ng)||ng.includes(normAr(s.group))));
      return cs.find(s=>s.label===String(l).trim())||cs.find(s=>lbl(s.label)===lbl(l))};
    PWROWS=rows.slice(hi+1).map(r=>{const un=cu>=0?clean(r[cu]).toLowerCase():'',nuRaw=cnu>=0?digits(r[cnu]).toLowerCase():'',pw=clean(r[cp]),nm=cn>=0?clean(r[cn]):'',g=cg>=0?clean(r[cg]):'',l=cl>=0?clean(r[cl]):'';
      if(!un&&!g&&!nuRaw&&!pw)return null;
      let a=un?all.find(x=>x.u.username===un):null,slot=a?a.slot:findSlot(g,l),create=false;
      if(!a&&slot){const free=slot.users.find(u=>!used.has(u.id));if(free)a=all.find(x=>x.u.id===free.id);else create=true}
      if(a)used.add(a.u.id);
      const nu=nuRaw&&(!a||nuRaw!==a.u.username)?nuRaw:'';
      const o={un:a?a.u.username:un,nu,pw,nm,a,slot,create,err:'',warn:'',skip:false,desc:slot?slot.group+' – '+slot.label:(g&&l?g+' – '+l:'')};
      if(!a&&!create)o.err=S.users.some(x=>x.username===un&&x.role==='admin')?'حساب مدير النظام لا يُغيَّر من الملف':'الجهة أو الحساب غير موجود في المنصة';
      else if(create&&(!nu||!pw))o.err='الحساب الجديد يحتاج اسم مستخدم وكلمة مرور';
      else if(!create&&!pw&&!nu&&(!nm||nm===a.name))o.skip=true;
      if(!o.err&&!o.skip){
        if(nu){if(!/^[a-z0-9._-]+$/.test(nu))o.err='اسم المستخدم الجديد بالأرقام والأحرف الإنجليزية فقط';else if(S.users.some(x=>x.username===nu&&x.id!==a?.u.id))o.err='اسم المستخدم الجديد مستخدم لحساب آخر';else(seenU[nu]=seenU[nu]||[]).push(o)}
        if(pw&&!o.err){o.err=pwProblem(pw,nu||o.un);if(!o.err)(seen[pw]=seen[pw]||[]).push(o)}
        if(!pw&&nu&&!o.err)o.err='اكتب كلمة مرور عند تغيير اسم المستخدم'}
      return o}).filter(Boolean);
    Object.values(seen).forEach(l=>{if(l.length>1)l.forEach(o=>{o.warn='كلمة المرور نفسها مستخدمة لحساب آخر في الملف'})});
    Object.values(seenU).forEach(l=>{if(l.length>1)l.forEach(o=>{if(!o.err)o.err='اسم المستخدم الجديد مكرر لأكثر من حساب'})});
    const ok=PWROWS.filter(o=>!o.err&&!o.skip),bad=PWROWS.filter(o=>o.err),sk=PWROWS.filter(o=>o.skip),nw=ok.filter(o=>o.create);
    box.innerHTML=`<div class="evsum"><span class="chip ok">${ok.length} جاهز للحفظ</span>${nw.length?`<span class="chip gold">منها ${nw.length} حساب جديد</span>`:''}${bad.length?`<span class="chip bad">${bad.length} فيه مشكلة</span>`:''}<span class="chip">${sk.length} بلا تغيير</span></div>
     ${bad.length?`<div class="banner bad"><div class="txt small">صحّح هذه الأسطر في الملف وارفعه مرة أخرى، أو احفظ الأسطر السليمة الآن وتبقى هذه كما هي.</div></div>`:''}
     <div class="tbl-wrap" style="max-height:340px;overflow:auto"><table class="stack"><thead><tr><th>الحساب</th><th>اسم المستخدم</th><th>الحالة</th></tr></thead><tbody>
     ${PWROWS.filter(o=>!o.skip).map(o=>`<tr><td data-l="الحساب">${esc(o.desc||'—')}${o.nm?`<br><span class="small muted">${esc(o.nm)}</span>`:''}</td><td data-l="اسم المستخدم" dir="ltr" style="text-align:right">${o.create?esc(o.nu||'—'):esc(o.un||'—')+(o.nu?` ← ${esc(o.nu)}`:'')}</td><td data-l="الحالة">${o.err?`<span class="chip bad">${esc(o.err)}</span>`:`<span class="chip ${o.create?'gold':'ok'}">${o.create?'حساب جديد':[o.nu?'اسم مستخدم جديد':'',o.pw?'كلمة مرور جديدة':'',o.nm&&o.nm!==o.a.name?'اسم جديد':''].filter(Boolean).join(' + ')}</span>${o.warn?`<br><span class="small muted">${esc(o.warn)}</span>`:''}`}</td></tr>`).join('')}</tbody></table></div>
     ${ok.length?`<div class="row" style="margin-top:12px"><button class="btn pri" id="pwsave" onclick="savePasswords()">حفظ ${ok.length} حساباً</button><span class="small muted" id="pwprog"></span></div>`:''}`;
  }catch(e){box.innerHTML=`<div class="banner bad"><div class="txt">${esc(errMsg(e))}</div></div>`}}
async function savePasswords(){const ok=PWROWS.filter(o=>!o.err&&!o.skip);const force=$('#pwforce').checked;const btn=$('#pwsave');btn.disabled=true;busy(true);
  let done=0;const fails=[],created=[];
  for(const o of ok){$('#pwprog').textContent=`جارٍ الحفظ ${done+1} من ${ok.length}…`;
    try{if(o.create){const s=o.slot;
        await q(sb.rpc('admin_create_user',{p_username:o.nu,p_password:o.pw,p_role:s.kind,p_sub:s.kind==='complex'?s.sub:null,p_complex:s.kind==='complex'?s.complexId:null,p_dept:s.kind==='dept'?s.deptId:null,p_name:o.nm||'',p_perms:s.kind==='dept'?(s.perms||{}):{}}));created.push(o.nu)}
      else{const u=o.a.u;
        if(o.pw||o.nu){await q(sb.rpc('admin_set_login',{p_user:u.id,p_username:o.nu||u.username,p_password:o.pw||''}));await q(sb.rpc('admin_set_must_change',{p_user:u.id,p_val:force}))}
        if(o.nm&&o.nm!==o.a.name){if(u.role==='complex'&&(u.sub==='manager'||u.sub==='leader')&&!u.name)await q(sb.from('complexes').update({[u.sub]:o.nm}).eq('id',u.complexId));else await q(sb.rpc('admin_set_name',{p_user:u.id,p_name:o.nm}))}}
      done++}catch(e){fails.push((o.desc||o.un)+(o.nm?' ('+o.nm+')':'')+': '+errMsg(e))}}
  if(created.length){await refresh();for(const un of created){const u=S.users.find(x=>x.username===un);if(u)try{await q(sb.rpc('admin_set_must_change',{p_user:u.id,p_val:force}))}catch(e){}}}
  busy(false);PWROWS=[];await refresh();
  modal('نتيجة تعيين كلمات المرور',`<p style="margin-top:0">حُفظ <b>${done}</b> من ${ok.length} حساباً${created.length?`، منها <b>${created.length}</b> حساب جديد`:''}.${force?' سيُطلب من أصحابها تغيير كلمة المرور عند أول دخول.':''}</p>
   ${fails.length?`<div class="banner bad"><div class="txt small">${fails.map(esc).join('<br>')}</div></div>`:''}
   <div class="banner warn"><div class="txt small">احذف ملف كلمات المرور من جهازك بعد توزيعها على أصحابها، ولا ترسله في مجموعة أو بريد مشترك.</div></div>`,[['تم','pri',()=>true]])}
function createMissingAccounts(){ask('إنشاء حسابات المديرين الناقصة','يُنشأ حساب مدير لكل مجمع ليس له حساب، باسم مستخدم مثل m01 وكلمة المرور 123456، ويُلزم صاحبه بتغييرها عند أول دخول.','إنشاء',async()=>{
  let n=0;const used=new Set(S.users.map(u=>u.username));
  for(const [i,c] of S.complexes.entries()){if(S.users.find(x=>x.complexId===c.id&&x.sub==='manager'))continue;
    const base='m'+String(i+1).padStart(2,'0');let un=base,j=2;while(used.has(un))un=base+'_'+(j++);used.add(un);
    await q(sb.rpc('admin_create_user',{p_username:un,p_password:'123456',p_role:'complex',p_sub:'manager',p_complex:c.id,p_dept:null,p_name:'',p_perms:{}}));n++}

}
function editComplex(id){

    <button type="button" class="btn sm" style="margin:8px 0" onclick="addCxAccount('${id}')">${I.plus}إضافة حساب للمجمع</button></div>`:''}`,
  [[id?'حفظ':'إضافة المجمع وحساب مديره','pri',async()=>{
    const name=$('#cn').value.trim(),mn=$('#an').value.trim(),un=$('#au').value.trim().toLowerCase(),pw=$('#aw').value;

function delUser(uid,cid){const u=S.users.find(x=>x.id===uid);if(!u)return;
  ask('حذف الحساب',`سيُحذف حساب «${userName(u)||u.username}» ولن يستطيع صاحبه الدخول. بيانات المجمع وخططه لا تتأثر.`,'حذف',async()=>{await q(sb.rpc('admin_delete_user',{p_user:uid}));toast('حُذف الحساب');await refresh();if(cid)editComplex(cid)})}
function logoData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,320/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/webp',.85))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function myAccount(){
  const u=me();const c=u.role==='complex'?S.complexes.find(x=>x.id===u.complexId):null;
  modal('حسابي',`<p class="small muted" style="margin-top:0">${esc(u.role==='complex'?subLabel(u)+' – '+c.name:deptName(u.deptId))} · اسم المستخدم: <span dir="ltr">${esc(u.username)}</span></p>
   <div class="field"><label for="myn">${u.role==='complex'?'اسم '+subLabel(u):'اسم المسؤول'}</label><input id="myn" value="${esc(userName(u))}"></div>
   ${c&&u.sub==='manager'?`<div class="field"><label for="myp">جوال المجمع</label><input id="myp" dir="ltr" value="${esc(c.phone)}"></div>`:''}
   <div class="field"><label for="myw">كلمة مرور جديدة</label><input id="myw" type="password" dir="ltr" placeholder="اتركها فارغة للإبقاء على الحالية"></div>
   <div class="field"><label>توقيعي المحفوظ (يُستخدم في الطلبات الإلكترونية)</label>${sigPad('mysig',u.sig||'')}</div>`,
  [['حفظ','pri',async()=>{const nm=$('#myn').value.trim(),pw=$('#myw').value;if(pw&&pwProblem(pw,u.username)){toast(pwProblem(pw,u.username));return false}
    if(u.role==='complex'&&(u.sub==='secretary'||u.sub==='assistant'))await q(sb.rpc('update_my_name',{p_name:nm}));
    else await q(sb.rpc('update_my_profile',{p_name:nm,p_phone:$('#myp')?$('#myp').value.trim():null}));
    if(pw)await q(sb.auth.updateUser({password:pw}));const ns=sigVal('mysig');if(ns)await saveMySig(ns);toast('حُفظت بيانات الحساب');await refresh();return true}]]);setTimeout(()=>sigInit('mysig'),0);
}

/* ---------- visits ---------- */
const VTYPES=['زيارة إشرافية','زيارة متابعة','زيارة تقييم','زيارة تعريفية'];
function visitState(v){if(v.date>todayISO())return['مجدولة',''];return v.notes?['تمت','ok']:['بانتظار تقرير الزيارة','warn']}
function vVisits(a){
  const cf=isCx()?me().complexId:(a.cx||'');
  const list=(S.visits||[]).filter(v=>!cf||v.complexId===cf).sort((x,y)=>y.date.localeCompare(x.date));
  const t=todayISO();const up=list.filter(v=>v.date>=t).reverse(),past=list.filter(v=>v.date<t);
  const card=v=>{const st=visitState(v);return `<div class="prog" onclick="openVisit('${v.id}')" role="button" tabindex="0"><span class="dot ${st[1]||'pri'}"></span><div class="prog-b">
    <div class="prog-t">${esc(v.type)}${isCx()?'':' – '+esc(cxName(v.complexId))}</div>
    <div class="prog-m"><span>${dayName(v.date)} ${hijri(v.date)}</span><span>${esc(deptName(v.deptId))}</span>${v.visitor?`<span>${esc(v.visitor)}</span>`:''}</div></div>
    <div class="row" style="flex-direction:column;align-items:flex-end;gap:4px"><span class="chip ${st[1]}">${st[0]}</span>${v.reply?'<span class="small muted">رد المجمع ✓</span>':''}</div></div>`};
  return `<div class="page-h"><div><h2>زيارات المجمعات</h2><p>${canVisit()?'يضيفها رئيس القسم وإدارة المجمعات والحلق وقسم المتابعة الإدارية':'الزيارات المسجلة لمجمعكم وملاحظاتها'}</p></div>${canVisit()?`<button class="btn pri" onclick="editVisit()">${I.plus}إضافة زيارة</button>`:''}</div>
  ${isCx()?'':`<div class="field" style="max-width:320px"><select aria-label="تصفية حسب المجمع" onchange="go('visits',{cx:this.value})"><option value="">كل المجمعات</option>${S.complexes.map(c=>`<option value="${c.id}" ${c.id===cf?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`}
  <section class="panel"><h3>القادمة (${up.length})</h3>${up.map(card).join('')||'<div class="empty">لا زيارات مجدولة</div>'}</section>
  <section class="panel"><h3>السابقة (${past.length})</h3>${past.map(card).join('')||'<div class="empty">لا زيارات سابقة</div>'}</section>`;
}
function openVisit(id){
  const v=(S.visits||[]).find(x=>x.id===id);if(!v)return;const st=visitState(v);
  const mine=isCx()&&me().complexId===v.complexId;const canEd=can('events')||(canVisit()&&v.deptId===me().deptId);
  const btns=[];
  if(canEd)btns.push(['تعديل','',()=>{closeModal();editVisit(id);return false}],['حذف','danger',()=>{ask('حذف الزيارة','','حذف',async()=>{await q(sb.from('visits').delete().eq('id',id));toast('حُذفت الزيارة');await refresh()});return false}]);
  if(mine)btns.push(['حفظ رد المجمع','pri',async()=>{await q(sb.rpc('visit_reply',{p_visit:id,p_reply:$('#vr').value.trim()}));toast('حُفظ رد المجمع');await refresh();return true}]);
  modal(esc(v.type)+' – '+esc(cxName(v.complexId)),`<div class="row" style="margin-bottom:12px"><span class="chip ${st[1]}">${st[0]}</span><span class="chip gold">${esc(deptName(v.deptId))}</span></div>
   <dl class="kv"><dt>التاريخ</dt><dd>${dayName(v.date)} ${hijri(v.date)}<br><span class="small muted">${greg(v.date)}م</span></dd>${v.visitor?`<dt>الزائر</dt><dd>${esc(v.visitor)}</dd>`:''}${v.purpose?`<dt>الهدف</dt><dd style="white-space:pre-line">${esc(v.purpose)}</dd>`:''}
   ${v.notes?`<dt>الملاحظات والتوصيات</dt><dd style="white-space:pre-line">${esc(v.notes)}</dd>`:''}${!mine&&v.reply?`<dt>رد المجمع</dt><dd style="white-space:pre-line">${esc(v.reply)}</dd>`:''}</dl>
   ${mine?`<div class="field"><label for="vr">رد المجمع على الملاحظات</label><textarea id="vr">${esc(v.reply||'')}</textarea></div>`:''}`,btns);
}
function editVisit(id){
  const v=id?S.visits.find(x=>x.id===id):{complexId:'',date:todayISO(),deptId:myDept(),type:VTYPES[0],visitor:'',purpose:'',notes:''};
  const vd=S.departments.filter(d=>(d.system&&d.sort===0)||d.visits);
  modal(id?'تعديل الزيارة':'إضافة زيارة',`
   <div class="grid2"><div class="field"><label for="vc">المجمع</label><select id="vc"><option value="">اختر المجمع</option>${S.complexes.map(c=>`<option value="${c.id}" ${c.id===v.complexId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
   <div class="field"><label for="vdt">تاريخ الزيارة</label><input id="vdt" type="date" value="${v.date}"><span class="hint" id="vdth">${hijri(v.date)}</span></div>
   <div class="field"><label for="vt">نوع الزيارة</label><select id="vt">${VTYPES.map(x=>`<option ${x===v.type?'selected':''}>${x}</option>`).join('')}</select></div>
   ${can('events')?`<div class="field"><label for="vdp">الجهة</label><select id="vdp">${vd.map(d=>`<option value="${d.id}" ${d.id===v.deptId?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>`:`<div class="field"><label>الجهة</label><input value="${esc(deptName(v.deptId))}" disabled></div>`}
   <div class="field"><label for="vv">اسم الزائر</label><input id="vv" value="${esc(v.visitor)}"></div></div>
   <div class="field"><label for="vp">هدف الزيارة</label><textarea id="vp">${esc(v.purpose)}</textarea></div>
   <div class="field"><label for="vn">الملاحظات والتوصيات</label><textarea id="vn" placeholder="تُكتب بعد تنفيذ الزيارة، وتظهر لحسابي المجمع">${esc(v.notes)}</textarea></div>`,
  [[id?'حفظ':'إضافة الزيارة','pri',async()=>{const x={complexId:$('#vc').value,date:$('#vdt').value,type:$('#vt').value,deptId:can('events')?$('#vdp').value:v.deptId,visitor:$('#vv').value.trim(),purpose:$('#vp').value.trim(),notes:$('#vn').value.trim()};
    if(!x.complexId||!x.date){toast('اختر المجمع وتاريخ الزيارة');return false}
    const row={complex_id:x.complexId,date:x.date,type:x.type,dept_id:x.deptId,visitor:x.visitor,purpose:x.purpose,notes:x.notes};
    if(id)await q(sb.from('visits').update(row).eq('id',id));else await q(sb.from('visits').insert(row));toast(id?'حُفظت الزيارة':'أُضيفت الزيارة');await refresh();return true}]],true);
  $('#vdt').oninput=e=>$('#vdth').textContent=hijri(e.target.value);
}

/* ---------- meetings ---------- */
const DEC_ST={open:['لم يبدأ',''],progress:['جارٍ','warn'],done:['منجز','ok']};
function visibleMeetings(){const u=me();return S.meetings.filter(m=>can('meetings')||m.complexIds.includes(u.complexId)||m.decisions.some(d=>d.complexId===u.complexId)).sort((a,b)=>b.date.localeCompare(a.date))}
function vMeetings(a){
  const ms=visibleMeetings();const f=a.f||'all';
  const mine=x=>can('meetings')||x.complexId===me().complexId;
  const openDecs=[];ms.forEach(m=>m.decisions.forEach(x=>{if(x.status!=='done'&&mine(x))openDecs.push({m,x})}));
  return `<div class="page-h"><div><h2>محاضر الاجتماعات</h2><p>القرارات تُتابع حتى إنجازها</p></div>${can('meetings')?`<button class="btn pri" onclick="editMeeting()">${I.plus}محضر جديد</button>`:''}</div>
  <div class="tabs"><button class="${f==='all'?'on':''}" onclick="go('meetings',{f:'all'})">المحاضر (${ms.length})</button><button class="${f==='open'?'on':''}" onclick="go('meetings',{f:'open'})">قرارات قيد المتابعة (${openDecs.length})</button></div>
  ${f==='open'?`<section class="panel">${openDecs.sort((a,b)=>(a.x.due||'').localeCompare(b.x.due||'')).map(o=>decRow(o.m,o.x,true)).join('')||'<div class="empty"><b>لا قرارات مفتوحة</b>كل القرارات منجزة</div>'}</section>`
  :`<section class="panel">${ms.map(m=>{const dn=m.decisions.filter(x=>x.status==='done').length;return `<div class="alert-item" style="cursor:pointer" onclick="go('meeting',{id:'${m.id}'})"><span><b>${esc(m.title)}</b><br><span class="small muted">${dayName(m.date)} ${hijri(m.date)} – ${esc(m.type)}</span></span><span class="chip ${dn===m.decisions.length&&dn?'ok':''}">${dn}/${m.decisions.length} قرار</span></div>`}).join('')||'<div class="empty"><b>لا محاضر بعد</b>'+(can('meetings')?'سجّل أول اجتماع من زر «محضر جديد»':'تظهر هنا اجتماعات مجمعك')+'</div>'}</section>`}`;
}
function decRow(m,x,showM){
  const late=x.status!=='done'&&x.due&&x.due<todayISO();
  const canD=can('meetings')||x.complexId===me().complexId;
  return `<div class="dec"><div><div class="dec-t">${esc(x.text)}</div><div class="dec-m">${esc(x.complexId?cxName(x.complexId):'القسم')}${x.owner?' – '+esc(x.owner):''}${x.due?' – الموعد '+hijriS(x.due):''}${showM?' – '+esc(m.title):''}${x.note?'<br>ملاحظة: '+esc(x.note):''}</div></div>
   <div class="row">${late?'<span class="chip bad">متأخر</span>':''}${canD?`<select aria-label="حالة القرار" onchange="setDec('${m.id}','${x.id}',this.value)" style="border:1px solid var(--line);border-radius:0;padding:4px 6px;background:var(--surface2)">${Object.entries(DEC_ST).map(([k,v])=>`<option value="${k}" ${k===x.status?'selected':''}>${v[0]}</option>`).join('')}</select>`:`<span class="chip ${DEC_ST[x.status][1]}">${DEC_ST[x.status][0]}</span>`}</div></div>`;
}
async function setDec(mid,did,v){busy(true);try{await q(sb.from('decisions').update({status:v}).eq('id',did));await refresh();const d=S.meetings.find(x=>x.id===mid)?.decisions.find(x=>x.id===did);
  if(!can('meetings')&&v==='done')ask('تم إنجاز القرار','','حفظ الملاحظة',async n=>{await q(sb.from('decisions').update({note:n}).eq('id',did));await refresh()},'ملاحظة الإنجاز (اختياري)',d?.note||'');else toast('حُدّثت حالة القرار')}catch(e){toast(errMsg(e))}busy(false)}
function vMeeting(a){
  const m=S.meetings.find(x=>x.id===a.id);if(!m)return '<div class="empty">المحضر غير موجود</div>';
  return `<div class="page-h"><div><h2>${esc(m.title)}</h2><p>${dayName(m.date)} ${hijri(m.date)} – ${greg(m.date)}م</p></div><div class="row"><button class="btn sm" onclick="go('meetings')">كل المحاضر</button>${can('meetings')?`<button class="btn sm" onclick="editMeeting('${m.id}')">تعديل</button>`:''}</div></div>
  <section class="panel"><dl class="kv"><dt>النوع</dt><dd>${esc(m.type)}</dd><dt>الحضور</dt><dd>${esc(m.attendees)||'—'}</dd><dt>المجمعات</dt><dd>${m.complexIds.length===S.complexes.length?'جميع المجمعات':m.complexIds.map(cxName).map(esc).join('، ')||'—'}</dd></dl>
   ${m.agenda?`<h3>جدول الأعمال</h3><p style="white-space:pre-line;margin-top:0">${esc(m.agenda)}</p>`:''}${m.minutes?`<h3>ما دار في الاجتماع</h3><p style="white-space:pre-line;margin-top:0">${esc(m.minutes)}</p>`:''}</section>
  <section class="panel"><h3>القرارات والتوصيات (${m.decisions.length})</h3>${m.decisions.map(x=>decRow(m,x)).join('')||'<p class="muted small">لا قرارات</p>'}</section>`;
}
function editMeeting(id){
  const m=id?S.meetings.find(x=>x.id===id):{title:'',date:todayISO(),type:'مع رواد المجمعات',complexIds:[],attendees:'',agenda:'',minutes:'',decisions:[]};
  const cxOpts=sel=>`<option value="">القسم</option>`+S.complexes.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
  const decHTML=x=>`<div class="dec-row" data-id="${x.id||''}"><input placeholder="نص القرار" value="${esc(x.text)}"><select>${cxOpts(x.complexId)}</select><input placeholder="المسؤول" value="${esc(x.owner)}"><input type="date" value="${x.due||''}"><button class="btn sm danger" type="button" onclick="this.parentNode.remove()" title="حذف">×</button></div>`;
  modal(id?'تعديل المحضر':'محضر اجتماع جديد',`
   <div class="field"><label for="mtt">عنوان الاجتماع</label><input id="mtt" value="${esc(m.title)}"></div>
   <div class="grid2"><div class="field"><label for="mtd">التاريخ</label><input id="mtd" type="date" value="${m.date}"><span class="hint" id="mtdh">${hijri(m.date)}</span></div>
   <div class="field"><label for="mty">النوع</label><select id="mty">${['مع رواد المجمعات','داخلي للقسم','زيارة إشرافية','مع جهة خارجية'].map(t=>`<option ${t===m.type?'selected':''}>${t}</option>`).join('')}</select></div></div>
   <div class="field"><label>المجمعات المعنية <button type="button" class="btn sm" style="margin-inline-start:8px" onclick="document.querySelectorAll('#mtc input').forEach(i=>i.checked=true)">الكل</button></label><div class="checks" id="mtc">${S.complexes.map(c=>`<label><input type="checkbox" value="${c.id}" ${m.complexIds.includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join('')}</div></div>
   <div class="field"><label for="mta">الحضور</label><input id="mta" value="${esc(m.attendees)}"></div>
   <div class="field"><label for="mtg">جدول الأعمال</label><textarea id="mtg">${esc(m.agenda)}</textarea></div>
   <div class="field"><label for="mtm">ما دار في الاجتماع</label><textarea id="mtm">${esc(m.minutes)}</textarea></div>
   <div class="field"><label>القرارات والتوصيات</label><div id="mdecs">${m.decisions.map(decHTML).join('')}</div><button type="button" class="btn sm" onclick="document.getElementById('mdecs').insertAdjacentHTML('beforeend',window._decTpl)">${I.plus}إضافة قرار</button></div>`,
  [['حفظ المحضر','pri',async()=>{
    const title=$('#mtt').value.trim();if(!title){toast('اكتب عنوان الاجتماع');return false}
    const decs=[...document.querySelectorAll('#mdecs .dec-row')].map(r=>{const f=r.querySelectorAll('input,select');const old=m.decisions.find(d=>d.id===r.dataset.id);return{id:r.dataset.id||null,text:f[0].value.trim(),complexId:f[1].value||null,owner:f[2].value.trim(),due:f[3].value,status:old?.status||'open',note:old?.note||''}}).filter(d=>d.text);
    const v={title,date:$('#mtd').value,type:$('#mty').value,complexIds:[...document.querySelectorAll('#mtc input:checked')].map(i=>i.value),attendees:$('#mta').value.trim(),agenda:$('#mtg').value.trim(),minutes:$('#mtm').value.trim(),decisions:decs};
    const row={title:v.title,date:v.date,type:v.type,complex_ids:v.complexIds,attendees:v.attendees,agenda:v.agenda,minutes:v.minutes};
    let mid=id;if(id)await q(sb.from('meetings').update(row).eq('id',id));else mid=(await q(sb.from('meetings').insert(row).select().single())).id;
    const keep=decs.filter(d=>d.id).map(d=>d.id);const gone=m.decisions.filter(d=>!keep.includes(d.id)).map(d=>d.id);
    if(gone.length)await q(sb.from('decisions').delete().in('id',gone));
    for(const [i,d] of decs.entries()){const dr={meeting_id:mid,text:d.text,complex_id:d.complexId,owner:d.owner,due:d.due||null,status:d.status,note:d.note,sort:i};
      if(d.id)await q(sb.from('decisions').update(dr).eq('id',d.id));else await q(sb.from('decisions').insert(dr))}
    toast('حُفظ المحضر');await loadAll();go('meeting',{id:mid});return true}]].concat(id?[['حذف','danger',()=>{ask('حذف المحضر','سيُحذف المحضر وقراراته.','حذف',async()=>{await q(sb.from('meetings').delete().eq('id',id));await loadAll();go('meetings')});return false}]]:[]),true);
  window._decTpl=decHTML({text:'',complexId:null,owner:'',due:''});
  $('#mtd').oninput=e=>$('#mtdh').textContent=hijri(e.target.value);
}

/* ---------- reports ---------- */
function vReports(a){
  const admin=can('reports')&&!isCx();const tid=a.tid||activeTerm()?.id;const term=S.terms.find(t=>t.id===tid);
  const cid=admin?(a.cid||'all'):me().complexId;
  if(!term)return '<div class="empty">لا يوجد فصل دراسي</div>';
  const sel=admin?`<div class="field" style="max-width:320px"><label for="rc">التقرير</label><select id="rc" onchange="go('reports',{tid:'${tid}',cid:this.value})"><option value="all">تقرير شامل لجميع المجمعات</option>${S.complexes.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:'';
  return `<div class="page-h"><div><h2>التقارير الفصلية</h2><p>جاهزة للطباعة أو الحفظ PDF</p></div><div class="row no-print"><button class="btn" onclick="printReport()">${I.print}طباعة</button><button class="btn pri" onclick="downloadReport()">${I.down}تنزيل التقرير</button></div></div>
  <div class="no-print">${termTabs(tid,'reports',admin?{cid}:{})}${sel}</div>
  <div class="report" id="report">${cid==='all'?reportAll(term):reportCx(cid,term)}</div>`;
}
function repHead(title,term,cid){return `<div class="rep-head">${logoHTML('',70)}${cid?`<span style="margin-inline-start:auto;order:3">${cxLogo(cid,64)}</span>`:''}<div><p>${esc(S.settings.org)} – ${esc(S.settings.dept)}</p><h1>${esc(title)}</h1><p>${esc(term.name)}: ${hijri(term.start)} – ${hijri(term.end)} – صدر في ${hijri(todayISO())}</p></div></div>`}
function reportCx(cid,term){
  const s=planStats(cid,term.id);const p=planOf(cid,term.id);const st=p?p.status:'none';
  const progs=S.programs.filter(x=>x.complexId===cid&&x.termId===term.id).sort((a,b)=>a.start.localeCompare(b.start));
  const cnt=(arr,key)=>{const m={};arr.forEach(x=>{const k=x[key]||'غير محدد';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const bars=list=>{const mx=Math.max(1,...list.map(x=>x[1]));return `<div class="rep-bars">${list.map(([c,n])=>`<div><span>${esc(c)}</span><i style="width:${n/mx*100}%"></i><span>${n}</span></div>`).join('')}</div>`};
  const byCat=cnt(progs,'category'),byStage=cnt(progs,'stage');
  const evAll=S.evidence.filter(e=>progs.some(x=>x.id===e.programId));
  const imgN=evAll.filter(e=>e.type==='image').length;

const WKEYS={rate:['إدخال المعلمين','r'],avg:['متوسط النقاط اليومي','n'],act:['تفعيل التطبيق','r'],doc:['التوثيق الإلكتروني','r']};

function mbar(v,max,cls,suffix){const w=Math.max(0,Math.min(100,v/max*100));return `<div class="mb ${cls||''}"><b>${suffix==='%'?(+v).toFixed(0)+'%':fmtN(v)}</b><i><s style="width:${w}%"></s></i></div>`}
function vWisam(a){

  const val=r=>sort==='act'?r.actPct:r[sort];rows.sort((x,y)=>val(y)-val(x));
  const maxAvg=Math.max(...rows.map(r=>r.avg),1);

  const myc=isCx()?me().complexId:null;const myIdx=rows.findIndex(r=>r.cid===myc);

    <td><div class="cxc">${wLogo(r.cid)}<span class="nm"><b>${esc(cxName(r.cid).replace('مجمع ',''))}</b><span>بدأ ${fmtD(r.start)} · ${r.days==='sun'?'الأحد–الخميس':'السبت–الأربعاء'}</span></span></div></td>
    <td class="n">${fmtN(r.tgt)}</td><td>${mbar(r.actPct,100,'g','%')}<span class="small muted">${r.act} طالباً</span></td>
    <td>${mbar(r.avg,maxAvg,'')}</td><td>${mbar(r.rate,100,'','%')}</td><td>${mbar(r.doc,100,'d','%')}</td><td class="n">${r.entryDays}</td></tr>`).join('');
  const tops=[...W.rows].sort((x,y)=>y.topPts-x.topPts).map(r=>`<div class="wtop">${wLogo(r.cid)}<div class="t"><b>${esc(r.top)}</b><span>${esc(cxName(r.cid))}</span></div><div class="pt">${fmtN(r.topPts)}<small>نقطة</small></div></div>`).join('');
  const best=k2=>{const b=[...rows].sort((x,y)=>(k2==='act'?y.actPct-x.actPct:y[k2]-x[k2]))[0];return esc(cxName(b.cid).replace('مجمع ',''))};
  return `<div class="w-head"><span class="w-logo"><img src="${WLOGO.wis}" alt="شعار برنامج وسام"></span>
    <div><div class="k">التقرير الإحصائي · المرحلة التجريبية</div><h2>برنامج وسام التحفيزي</h2><p>حتى ${dayName(W.asOf)} ${greg(W.asOf)} (${hijri(W.asOf)}) · ${W.rows.length} مجمعات · المصدر: ${esc(W.source)}</p></div>
    <span class="sp"></span>${can('wisam')?`<div class="row"><button class="btn sm" onclick="editWisam()">تحديث الإحصائيات</button></div>`:'<span class="chip" style="background:transparent;color:#D0D0D2;border-color:#43434C">للاطلاع فقط</span>'}</div>
  ${myc?(myIdx>=0?`<div class="banner pri"><div class="txt"><b>${esc(cxName(myc))}: المرتبة ${myIdx+1} من ${rows.length}</b>حسب ${WKEYS[sort][0]}، وصف مجمعكم مظلّل في الجدول.</div></div>`:`<div class="banner pri"><div class="txt"><b>${esc(cxName(myc))} ليس ضمن المجمعات المشاركة في برنامج وسام حالياً</b>تظهر لكم إحصائيات المجمعات المشاركة للاطلاع.</div></div>`):''}
  <div class="kpis">

async function toJpeg(blob){const url=URL.createObjectURL(blob);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const k=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}finally{URL.revokeObjectURL(url)}}
const normAr=x=>String(x||'').replace(/مجمع|حلق|حلقات|لتحفيظ.*$|[()\s]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/^ال/,'');
function matchCx(name){const n=normAr(name);if(!n)return null;if(/مصيريعي/.test(n))return 'c10';let best=null;S.complexes.forEach(c=>{const m=normAr(c.name);if(m===n||m.includes(n)||n.includes(m))best=best||c.id});return best}

async function reqSave(r){
  try{const d=await q(sb.from('requests').update({status:r.status,complex_id:r.complexId||null,target_cx:r.data.target||null,doc:reqDoc(r)}).eq('id',r.id).eq('ver',r.ver).select('id,ver'));

    r.ver=d[0].ver;return true}
  catch(e){await refresh();throw e}}
async function saveMySig(sig){if(!sig||!session)return;await q(sb.from('user_sigs').upsert({user_id:session.uid,sig,updated_at:new Date().toISOString()}));const u=me();if(u)u.sig=sig}
